name: Build Passwall

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'luci-app-passwall/**'
      - '.github/workflows/build-passwall.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_generic
            sdk_target: armsr-armv8
            sdk_path: armsr/armv8
            release_prefix: 23.05-24.10

    env:
      PKG_NAME: passwall
      LUCI_PKG_NAME: luci-app-passwall
      OPENWRT_SERIES: "24.10"
      TZ: Asia/Jakarta

    steps:
      - name: Checkout passwall source
        uses: actions/checkout@v5
        with:
          path: passwall-source

      - name: Checkout passwall packages source
        uses: actions/checkout@v5
        with:
          repository: Openwrt-Passwall/openwrt-passwall-packages
          path: passwall-packages

      - name: Read package version
        run: |
          PKG_VERSION=$(sed -n 's/^PKG_VERSION:=//p' passwall-source/luci-app-passwall/Makefile | head -n1 | tr -d '[:space:]')
          if [ -z "$PKG_VERSION" ]; then
            echo "PKG_VERSION not found in passwall-source/luci-app-passwall/Makefile"
            exit 1
          fi

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=passwall-${{ matrix.arch }}-$PKG_VERSION.tar.gz" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "Package     : luci-app-passwall"
          echo "Version     : $PKG_VERSION"
          echo "Target Arch : ${{ matrix.arch }}"
          echo "SDK Target  : ${{ matrix.sdk_target }}"
          echo "OpenWrt Series : $OPENWRT_SERIES"
          echo "Archive     : passwall-${{ matrix.arch }}-$PKG_VERSION.tar.gz"
          echo "=================================================="

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev \
            file wget subversion swig time tar zstd python3 python3-pip python3-setuptools curl

      - name: Resolve latest OpenWrt SDK
        id: resolve_sdk
        uses: Afqoro/Openwrt-Sdk-ResolverKu@main
        with:
          sdk_path: ${{ matrix.sdk_path }}
          sdk_target: ${{ matrix.sdk_target }}
          openwrt_series: ${{ env.OPENWRT_SERIES }}
    
      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.resolve_sdk.outputs.sdk_archive }}
          key: ${{ steps.resolve_sdk.outputs.sdk_cache_key }}

      - name: Download OpenWrt SDK
        run: |
          SDK_ARCHIVE="${{ steps.resolve_sdk.outputs.sdk_archive }}"
          SDK_URL="${{ steps.resolve_sdk.outputs.sdk_url }}"

          if [ ! -f "$SDK_ARCHIVE" ]; then
            wget -O "$SDK_ARCHIVE" "$SDK_URL"
          fi

          echo "=================================================="
          echo "Downloaded SDK archive:"
          ls -lh "$SDK_ARCHIVE"
          echo "=================================================="

      - name: Delete stale SDK caches for same target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_KEY: ${{ steps.resolve_sdk.outputs.sdk_cache_key }}
          PREFIX: ${{ steps.resolve_sdk.outputs.sdk_cache_prefix }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          current_key = os.environ["CURRENT_KEY"]
          prefix = os.environ["PREFIX"]

          owner, name = repo.split("/", 1)
          base = f"https://api.github.com/repos/{owner}/{name}/actions/caches?per_page=100"

          req = urllib.request.Request(
              base,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
          except Exception as e:
              print(f"Cache list skipped: {e}")
              sys.exit(0)

          caches = data.get("actions_caches", [])
          stale = [
              c for c in caches
              if c.get("key", "").startswith(prefix) and c.get("key") != current_key
          ]

          if not stale:
              print("No stale SDK caches to delete.")
              sys.exit(0)

          for c in stale:
              cache_id = c["id"]
              key = c.get("key", "")
              url = f"https://api.github.com/repos/{owner}/{name}/actions/caches/{cache_id}"
              req = urllib.request.Request(
                  url,
                  method="DELETE",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      status = getattr(resp, "status", None)
                  print(f"Deleted stale cache: {key} (id={cache_id}, status={status})")
              except Exception as e:
                  print(f"Failed to delete cache {key} (id={cache_id}): {e}")
          PY

          echo "[$(date '+%H:%M:%S')] sdk cache...OK" >> "$RUNNER_TEMP/build.log"
          
      - name: Extract OpenWrt SDK
        run: |
          SDK_ARCHIVE="${{ steps.resolve_sdk.outputs.sdk_archive }}"

          find . -maxdepth 1 -type d -name 'openwrt-sdk-*' -exec rm -rf {} +
          tar --use-compress-program=unzstd -xf "$SDK_ARCHIVE"
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)

          if [ -z "$SDK_DIR" ]; then
            echo "SDK_DIR not found after extraction"
            exit 1
          fi

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "Using SDK_DIR=$SDK_DIR"
          echo "=================================================="

      - name: Prepare custom packages
        run: |
          mkdir -p "$SDK_DIR/package/custom"

          rm -rf "$SDK_DIR/package/custom/luci-app-passwall"
          rm -rf "$SDK_DIR/package/custom/chinadns-ng"
          rm -rf "$SDK_DIR/package/custom/dns2socks"
          rm -rf "$SDK_DIR/package/custom/tcping"

          cp -r "$GITHUB_WORKSPACE/passwall-source/luci-app-passwall" "$SDK_DIR/package/custom/luci-app-passwall"
          cp -r "$GITHUB_WORKSPACE/passwall-packages/chinadns-ng" "$SDK_DIR/package/custom/chinadns-ng"
          cp -r "$GITHUB_WORKSPACE/passwall-packages/dns2socks" "$SDK_DIR/package/custom/dns2socks"
          cp -r "$GITHUB_WORKSPACE/passwall-packages/tcping" "$SDK_DIR/package/custom/tcping"

          echo "=================================================="
          echo "Custom packages prepared:"
          ls -la "$SDK_DIR/package/custom"
          echo "=================================================="

      - name: Update feeds
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci

          echo "=================================================="
          echo "Feeds updated"
          echo "=================================================="

      - name: Generate config
        working-directory: ${{ env.SDK_DIR }}
        run: |
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-passwall=m
          CONFIG_PACKAGE_chinadns-ng=m
          CONFIG_PACKAGE_dns2socks=m
          CONFIG_PACKAGE_tcping=m
          EOF

          make defconfig

          echo "=================================================="
          echo "Config generated"
          echo "=================================================="

      - name: Build packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "=================================================="
          echo "Start building chinadns-ng"
          echo "=================================================="
          make package/custom/chinadns-ng/compile V=s -j"$(nproc)"

          echo "=================================================="
          echo "Start building dns2socks"
          echo "=================================================="
          make package/custom/dns2socks/compile V=s -j"$(nproc)"

          echo "=================================================="
          echo "Start building tcping"
          echo "=================================================="
          make package/custom/tcping/compile V=s -j"$(nproc)"

          echo "=================================================="
          echo "Start building luci-app-passwall"
          echo "=================================================="
          make package/custom/luci-app-passwall/compile V=s -j"$(nproc)"

      - name: Collect and rename IPK files
        run: |
          mkdir -p "artifacts/${{ matrix.arch }}"

          find "$SDK_DIR/bin/packages" -type f \
            \( -name 'luci-app-passwall_*.ipk' \
            -o -name 'chinadns-ng_*.ipk' \
            -o -name 'dns2socks_*.ipk' \
            -o -name 'tcping_*.ipk' \) | while read -r file; do
              base="$(basename "$file")"
              new_name="${{ matrix.release_prefix }}_${base}"
              cp -v "$file" "artifacts/${{ matrix.arch }}/${new_name}"
            done

          echo "=================================================="
          echo "Collected and renamed IPK files:"
          ls -lh "artifacts/${{ matrix.arch }}/"
          echo "=================================================="

      - name: Create tar.gz package
        run: |
          tar -czf "$ARCHIVE_NAME" -C "artifacts/${{ matrix.arch }}" .

          echo "=================================================="
          echo "Created archive:"
          ls -lh "$ARCHIVE_NAME"
          echo "=================================================="

      - name: Generate SHA256
        run: |
          sha256sum "$ARCHIVE_NAME" | awk '{print $1}' > sha256.txt
          echo "SHA256=$(cat sha256.txt)" >> "$GITHUB_ENV"

          echo "=================================================="
          echo "SHA256:"
          cat sha256.txt
          echo "=================================================="

      - name: Upload file to API endpoint
        env:
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_API_KEY: ${{ secrets.UPLOAD_API_KEY }}
        run: |
          echo "=================================================="
          echo "Uploading archive to API endpoint"
          echo "=================================================="

          RESPONSE="$(
            curl --fail --show-error --silent \
              -X POST "$UPLOAD_URL" \
              -H "Authorization: Bearer $UPLOAD_API_KEY" \
              -F "file=@$ARCHIVE_NAME" \
              -F "category=ipk_mod_public" \
              -F "subfolder=${{ matrix.arch }}" \
              -F "repository=${{ github.repository }}" \
              -F "sha256=${SHA256}" \
              -F "notify_telegram=1" \
              -F "pkg_name=passwall" \
              -F "pkg_version=${PKG_VERSION}" \
              -F "arch=${{ matrix.arch }}" \
              -F "mod_name=MahaVPN" \
              -F "caption_title=Passwall build automation"
          )"

          python3 - <<'PY' "$RESPONSE"
          import json, sys
          data = json.loads(sys.argv[1])
          print("==================================================")
          print(f"success : {data.get('success')}")
          print(f"message : {data.get('message')}")
          if data.get("data"):
              import json as _json
              print("payload :")
              print(_json.dumps(data["data"], indent=2))
          print("==================================================")
          PY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passwall-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            artifacts/${{ matrix.arch }}/*.ipk
            sha256.txt

      - name: Done
        run: |
          echo "=================================================="
          echo "Build and upload finished successfully"
          echo "=================================================="