local api = require "luci.passwall.api"
-%>

.block {
	margin: .5rem;
	padding: 0;
	font-weight: normal;
	font-style: normal;
	line-height: 1;
	font-family: inherit;
	min-width: inherit;
	overflow-x: auto;
	overflow-y: hidden;
	border: 1px solid rgba(0,0,0,.05);
	border-radius: .5rem;
	box-shadow: 0 0 1.5rem 0 rgba(136,152,170,.12);
	background: linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(250,252,255,.96) 100%);
}
.img-con {
	margin: 1rem;
}
.green { font-size:.9rem; color:#2dce89; }
.red { font-size:.9rem; color:#fb6340; }
.yellow { font-size:.9rem; color:#fb9a05; }
.block img { width: 48px; height: auto; }
.block h4 {
	font-size: .8125rem;
	font-weight: 600;
	margin: 1rem 0rem 1rem 1rem;
	color:#8898aa!important;
	line-height: 1.8em;
	min-height: 48px;
	border-radius: 12.375px;
}
.bandwidth-card {
	position: relative;
	padding: .75rem .85rem .35rem .85rem;
}
.bandwidth-head {
	display:flex;
	align-items:center;
	justify-content:space-between;
	gap:.5rem;
	padding: .15rem .1rem .55rem .1rem;
}
.bandwidth-title {
	font-size: .92rem;
	font-weight: 600;
	color: #3b4a69;
	letter-spacing: .01em;
}
.bandwidth-subtitle {
	font-size: .72rem;
	color: #98a6bd;
}
.bandwidth-dot {
	display:inline-block;
	width: .55rem;
	height: .55rem;
	border-radius: 50%;
	background: linear-gradient(135deg, #6a8dff, #7de3c3);
	margin-right: .45rem;
	vertical-align: middle;
}
.bandwidth-chart-wrap {
	border-radius: .65rem;
	overflow: hidden;
	background: linear-gradient(180deg, rgba(246,249,252,.95) 0%, rgba(240,245,250,.95) 100%);
	border: 1px solid rgba(136,152,170,.16);
	min-height: 150px;
}
.bandwidth-chart-wrap > div {
	padding-top: .2rem;
}
.hidden { display: none !important; }

@media screen and (max-width: 720px) {
	.block { margin: 0.2rem; }
	.pure-u-1-4 { width: 50%; }
	.pure-u-1-2 { width: 100%; }
	.block h4 { margin: 1rem 0rem 1rem 0.5rem; }
	.bandwidth-card { padding: .6rem; }
}
@media screen and (max-width: 480px) {
	.img-con { margin: 1.5rem 0.5rem; }
	.block img { width: 36px; }
	.bandwidth-head { display:block; }
}
</style>

<fieldset id="_passwall_status_fieldset" class="cbi-section">
	<legend><%:Running Status%></legend>
	<div class="pure-g status">
		<div class="pure-u-1-4">
			<div class="block pure-g">
				<div class="pure-u-1-3"><div class="img-con"><img src="<%=media%>/navbar/passwall2.png" /></div></div>
				<div class="pure-u-2-3"><h4 id="status_tcp_node">TCP<br /><span class="red"><%:NOT RUNNING%></span></h4></div>
			</div>
		</div>
		<div class="pure-u-1-4">
			<div class="block pure-g">
				<div class="pure-u-1-3"><div class="img-con"><img src="<%=media%>/navbar/passwall2.png" /></div></div>
				<div class="pure-u-2-3"><h4 id="status_udp_node">UDP<br /><span class="red"><%:NOT RUNNING%></span></h4></div>
			</div>
		</div>
		<div class="pure-u-1-4">
			<div class="block pure-g">
				<div class="pure-u-1-3"><div class="img-con"><img src="<%=media%>/navbar/passwall2.png" /></div></div>
				<div class="pure-u-2-3"><h4 id="status_dns">DNS<br /><span class="red"><%:NOT RUNNING%></span></h4></div>
			</div>
		</div>
		<div class="pure-u-1-4">
			<div class="block pure-g">
				<div class="pure-u-1-3"><div class="img-con"><img src="<%=media%>/navbar/passwall2.png" /></div></div>
				<div class="pure-u-2-3"><h4 id="status_haproxy"><%:Load Balancing%><br /><span class="red"><%:NOT RUNNING%></span></h4></div>
			</div>
		</div>

		<div class="pure-u-1-1 hidden" id="pw_bandwidth_container">
			<div class="block bandwidth-card">
				<div class="bandwidth-head">
					<div>
						<div class="bandwidth-title"><span class="bandwidth-dot"></span>Realtime Traffic</div>
						<div class="bandwidth-subtitle">Live interface monitor for br-lan</div>
					</div>
				</div>
				<div class="bandwidth-chart-wrap">
					<div id="pw_bandwidth_chart"
						data-netdata="net.br-lan"
						data-title=" "
						data-height="145"
						data-legend="yes"
						data-chart-library="dygraph"
						data-width="100%"
						data-after="-120"
						data-points="120"
						data-colors="#6a8dff #7de3c3">
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>var netdataNoBootstrap = true;</script>
	<script>
	(function () {
		var bandContainer = document.getElementById('pw_bandwidth_container');
		if (!bandContainer) return;

		var netdataHost = window.location.protocol + '//' + window.location.hostname + ':19999';
		var script = document.createElement('script');
		var timer;
		var finished = false;

		function hideChart() {
			bandContainer.classList.add('hidden');
		}

		function showChart() {
			bandContainer.classList.remove('hidden');
		}

		function done(ok) {
			if (finished) return;
			finished = true;
			if (timer) clearTimeout(timer);
			if (ok) {
				showChart();
				window.NETDATA_HOST = netdataHost;
				if (window.NETDATA && typeof window.NETDATA.parseDom === 'function') {
					setTimeout(function () {
						try { window.NETDATA.parseDom(); } catch (e) {}
					}, 80);
				}
			} else {
				hideChart();
			}
		}

		hideChart();
		timer = setTimeout(function () { done(false); }, 2500);
		script.async = true;
		script.src = netdataHost + '/dashboard.js';
		script.onload = function () { done(true); };
		script.onerror = function () { done(false); };
		document.body.appendChild(script);
	})();
	</script>

	<script>
		//<![CDATA[
		var imgs = document.getElementsByTagName('img');
		for (var i = 0; i < imgs.length; i++) {
			document.getElementsByTagName('img')[i].setAttribute('oncontextmenu', 'return false;');
			document.getElementsByTagName('img')[i].setAttribute('ondragstart', 'return false;');
		}
		XHR.poll(5, '<%=api.url("index_status")%>', null,
			function (x, data) {
				var status_dns = document.getElementById('status_dns');
				var status_haproxy = document.getElementById('status_haproxy');
				if (data) {
					var status_tcp_node = document.getElementById('status_tcp_node');
					if (status_tcp_node) {
						var text = 'TCP<br />';
						text += data['tcp_node_status'] ? '<span class="green"><%:RUNNING%></span>' : '<span class="red"><%:NOT RUNNING%></span>';
						status_tcp_node.innerHTML = text;
					}

					var status_udp_node = document.getElementById('status_udp_node');
					if (status_udp_node) {
						var text = 'UDP<br />';
						text += data['udp_node_status'] ? '<span class="green"><%:RUNNING%></span>' : '<span class="red"><%:NOT RUNNING%></span>';
						status_udp_node.innerHTML = text;
					}

					status_dns.innerHTML = data.dns_mode_status ? 'DNS<br /><span class="green"><%:RUNNING%></span>' : 'DNS<br /><span class="red"><%:NOT RUNNING%></span>';

					if (status_haproxy) {
						if (data.haproxy_status === '-1') {
							status_haproxy.innerHTML = '<%:Load Balancing%><br /><span class="red"><%:UNINSTALLED%></span>';
						} else if (data.haproxy_status === '0') {
							status_haproxy.innerHTML = '<%:Load Balancing%><br /><span class="green"><%:RUNNING%></span>';
						} else {
							status_haproxy.innerHTML = '<%:Load Balancing%><br /><span class="red"><%:NOT RUNNING%></span>';
						}
					}
				}
			}
		);
		//]]>
	</script>
</fieldset>
